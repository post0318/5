name: Citigroup Insights 수집

# CLAUDE.md 방침(오너 승인, 2026-09-19): citigroup.com 의 /global/insights
# 를 사이트맵 기반으로 하루 1회 조회한다. robots.txt User-agent: * 기준
# /insights 차단 없음.

on:
  schedule:
    - cron: "35 23 * * *" # 23:35 UTC = 08:35 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-citigroup-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
