name: iM증권 리서치 수집

# CLAUDE.md 방침(오너 결정 2026-09-25): www.imfnsec.com 리서치 게시판 내부 JSON
# (/_json/source.jsp, 세션 키 절차 필요·로그인 불필요)을 하루 2회, 개인용으로만
# 조회한다. robots.txt 는 없다 — 다른 예외들과 동일 조건(개인용·저빈도·요청 간격).

on:
  # 예약 실행은 오라클 타이머(ops/oracle/install-schedules.sh, 2026-10-04) — 여기는 수동 비상용
  workflow_dispatch: {}

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # 공용 추출기가 pdf-parse 를 import 한다(PDF 는 로그인 없이 받아짐).
      - run: npm ci
      - run: node scripts/collect-im-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
