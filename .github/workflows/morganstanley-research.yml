name: 모간스탠리 인사이트 수집

# CLAUDE.md 방침(오너 승인, 2026-09-19): morganstanley.com 의 /insights/
# articles 를 사이트맵(robots.txt가 AI 크롤러까지 전부 허용하는 가장 깨끗한
# 케이스) 기반으로 하루 1회 조회한다.

on:
  # 예약 실행은 오라클 타이머(ops/oracle/install-schedules.sh, 2026-10-04) — 여기는 수동 비상용
  workflow_dispatch: {}

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-morganstanley-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
