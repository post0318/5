name: BNK투자증권 기업분석 수집

# CLAUDE.md 방침(오너 승인 예외): www.bnkfn.co.kr 리서치 목록을 하루 1회,
# 개인용으로만 조회한다. 로그인 없이 서버렌더 HTML 이 나오고 PDF 도 직링크로
# 받아진다. 종목코드는 목록에 없어 서버 라우트의 이름 검색에 맡긴다.

# 2026-10-03 예약 중단: BNK 는 해외 IP 를 막아(GitHub 미국·오라클 일본·구글 서울 Cloud Run[미국 IP] 모두 시간 초과)
# 사무실 PC 작업 스케줄러(macro-research-bnk, 08·10·12·14·16·18시 05분)가 한국 IP 로 수집해 오라클로 보낸다. 여기는 수동만.
on:
  workflow_dispatch: {}

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-bnk-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
