name: 신한투자증권 기업분석 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): bbs2.shinhansec.com 게시판 JSON API를
# 하루 1회, 개인용으로만 조회한다. robots.txt가 Disallow: / 라 다른 예외들과
# 동일한 조건(개인용·로컬(GitHub Actions 개인 자동화)·저빈도)으로 승인됨.
# 앱 배포본(Vercel)에는 이 수집 코드가 없다 — DB 적재 라우트는 결과만 받는다.

on:
  # 예약 실행은 오라클 타이머(ops/oracle/install-schedules.sh, 2026-10-04) — 여기는 수동 비상용
  workflow_dispatch: {}

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # 수집 스크립트가 pdf-parse 를 import 한다 — 설치 단계가 없으면
      # ERR_MODULE_NOT_FOUND 로 죽는다(실측, 2026-09).
      - run: npm ci
      - run: node scripts/collect-shinhan-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
