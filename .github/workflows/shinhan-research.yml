name: 신한투자증권 기업분석 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): bbs2.shinhansec.com 게시판 JSON API를
# 하루 1회, 개인용으로만 조회한다. robots.txt가 Disallow: / 라 다른 예외들과
# 동일한 조건(개인용·로컬(GitHub Actions 개인 자동화)·저빈도)으로 승인됨.
# 앱 배포본(Vercel)에는 이 수집 코드가 없다 — DB 적재 라우트는 결과만 받는다.

on:
  schedule:
    # 하루 2회(오너 지시, 2026-09 -- 작성시간과 로드시간의 시차 보완).
    - cron: "0 23 * * *" # 23:00 UTC = 08:00 KST(1차)
    - cron: "0 3 * * *" # 03:00 UTC = 12:00 KST(2차)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 수집 스크립트가 pdf-parse 를 import 한다 — 설치 단계가 없으면
      # ERR_MODULE_NOT_FOUND 로 죽는다(실측, 2026-09).
      - run: npm ci
      - run: node scripts/collect-shinhan-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
