name: 하나증권 기업분석 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): www.hanaw.com 리서치센터를 하루 1회,
# 개인용으로만 조회한다. robots.txt가 Disallow: / 라 다른 예외들과 동일한
# 조건(개인용·로컬 실행(GitHub Actions 개인 자동화)·저빈도)으로 승인됨.

on:
  schedule:
    # 00:10 UTC = 09:10 KST(신한 수집 직후, 장 시작 전)
    - cron: "10 0 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect-hana-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
