name: 재무 5층 구조 배치 갱신 (fin_sym·fin_stmt)

# 유니버스(미국) + 최근 30일 조회 종목의 재무 조립 결과를 DB 에 적재한다(docs/metrics/architecture.md §5.1).
# 저장본이 없거나 · 엔진판이 다르거나 · 새 정기공시가 나온 종목만 조립(refreshStored — 라우트와 같은 함수).
# 조립은 이 실행 서버에서 한다(scripts/run/fin-build.mts — 운영 서버 CPU 사용 안 함, 2026-10-03 오너 결정. 예전엔 운영 앱
# /api/cron/fin-build 를 불러 Vercel 이 종목당 30~40초씩 조립했다). 저장본 엔진판이 운영 배포판과 같아야 운영이 쓰므로
# 운영 배포판 커밋(GET — 계산 없음)을 받아 그 코드로 조립한다.
#   - 하루 1회: 21:10 UTC = 06:10 KST (미국 장 마감·공시 반영 뒤)
#   - 수동: workflow_dispatch (symbols 를 주면 그 종목만)
# 조립 오류·제출 목록 조회 실패(skipped) 종목이 있으면 실패로 끝낸다(재시도는 원인 확인 뒤 수동).

on:
  schedule:
    - cron: "10 21 * * *"
  workflow_dispatch:
    inputs:
      symbols:
        description: "쉼표 구분 종목(비우면 유니버스 전체 중 갱신 대상만)"
        default: ""
      ref:
        description: "조립에 쓸 커밋(비우면 운영 배포판 — 운영이 멈췄을 때 시험용)"
        default: ""

concurrency:
  group: fin-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE: ${{ vars.APP_URL }}
      SYMBOLS: ${{ inputs.symbols }}
      REF: ${{ inputs.ref }}
    steps:
      - name: 운영 배포판 확인
        id: ver
        run: |
          if [ -n "${REF:-}" ]; then echo "지정 커밋: $REF"; echo "v=$REF" >> "$GITHUB_OUTPUT"; exit 0; fi
          v=$(curl -sS --max-time 20 "$BASE/api/cron/ttm-build" | jq -r '.version // ""' 2>/dev/null || echo "")
          if [ -z "$v" ] || [ "$v" = "local" ]; then echo "::error::운영 배포판 확인 실패(${v:-응답 없음})"; exit 1; fi
          echo "운영 배포판: $v"; echo "v=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.v }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 갱신 대상 조립·저장(실행 서버)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NODE_OPTIONS: --conditions=react-server
        run: |
          set -u
          a=""
          if [ -n "${SYMBOLS:-}" ]; then a="--symbols=$SYMBOLS"; fi
          # 운영 배포판 커밋에 실행 스크립트가 없으면(이 방식 도입 전 배포판) master 의 스크립트를 쓴다 — 조립 함수는 체크아웃한 배포판 코드
          f=scripts/run/fin-build.mts
          if [ ! -f "$f" ]; then mkdir -p scripts/run && git show origin/master:scripts/run/fin-build.mts > "$f"; fi
          npx -y tsx@4.23.15 --tsconfig tsconfig.json "$f" $a --minutes=100
