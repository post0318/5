name: 유안타증권 리서치 수집

# CLAUDE.md 방침(오너 승인 예외): www.myasset.com 리서치 목록(기업·산업·투자전략·
# 경제분석)을 하루 2회, 개인용으로만 조회한다. robots.txt 자체가 없는 사이트 —
# 명시적 Disallow는 없지만 다른 예외들과 동일한 조건(개인용·로컬 실행·저빈도)으로 승인됨.
#
# 2026-09-13 중단(발췌·목표주가 추출 실패로 판단, 한경 컨센서스 경유로 전환)했다가
# 2026-09-25 재개(오너 결정): 재점검에서 이 수집기가 정상 작동했고 한경 쪽 목표가
# 오류가 확인돼 직접 수집으로 되돌리고 한경 수집기에서 유안타를 제외했다.

on:
  schedule:
    - cron: "22 23 * * *" # 23:22 UTC = 08:22 KST(1차)
    - cron: "22 3 * * *" # 03:22 UTC = 12:22 KST(2차)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 수집 스크립트가 pdf-parse 를 import 한다 — 설치 단계가 없으면
      # ERR_MODULE_NOT_FOUND 로 죽는다(실측, 2026-09).
      - run: npm ci
      - run: node scripts/collect-yuanta-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
