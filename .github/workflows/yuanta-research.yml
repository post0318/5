name: 유안타증권 기업분석 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): www.myasset.com 기업분석 목록을 하루 1회,
# 개인용으로만 조회한다. robots.txt 자체가 없는 사이트 — 명시적 Disallow는
# 없지만 다른 예외들과 동일한 조건(개인용·로컬 실행·저빈도)으로 승인됨.

on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC = 09:30 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect-yuanta-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
