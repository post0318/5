name: 한국투자증권 전략/이슈 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): securities.koreainvestment.com 목록을 하루
# 1회, 개인용으로만 조회한다. 다른 KIS 수집기와 같은 사이트·같은 조건이고
# 게시판만 다르다(jkGubun=6, 산업분석/투자전략/시황 전용 — 오너가 URL을
# 직접 제시해 발견, 2026-09).

on:
  schedule:
    - cron: "45 0 * * *" # 00:45 UTC = 09:45 KST (다른 KIS 수집기와 동일 시각)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-kis-strategy-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
