name: 오라클 작업 폴더 동기화

# 수집기(scripts/)·운영 스크립트(ops/oracle/)만 바뀐 푸시는 앱 재배포(deploy-oracle.yml — src 등 앱 파일만 감시)가 돌지 않아
# 오라클 작업 폴더(/opt/macro/jobs)가 옛 커밋에 머문다. 이 워크플로가 작업 폴더만 그 커밋으로 맞춘다(앱은 재빌드하지 않음, 2026-10-04).
# 배포 키는 서버에서 강제 명령(/opt/macro/ops/deploy-entry.sh)에 묶여 `sync-jobs <40자 커밋>` 만 된다(2026-10-06) —
# 서버가 이 커밋의 ops/oracle/post-deploy.sh 를 받아 실행한다.

on:
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "ops/oracle/**"
  workflow_dispatch:

concurrency:
  group: oracle-sync-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: vars.ORACLE_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH 키
        env:
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          HOST: ${{ vars.ORACLE_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: 작업 폴더를 이 커밋으로
        env:
          HOST: ${{ vars.ORACLE_HOST }}
          SHA: ${{ github.sha }}
        run: ssh -o BatchMode=yes "ubuntu@$HOST" "sync-jobs $SHA" < /dev/null
