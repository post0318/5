name: JP모간 글로벌 리서치 수집

# CLAUDE.md 방침(오너 승인, 2026-09-19): jpmorgan.com 의 /insights/
# global-research 를 사이트맵(robots.txt에 Allow: /sitemap.xml 명시) 기반
# 으로 하루 1회 조회한다. robots.txt User-agent: * 기준 차단 없음.

on:
  schedule:
    - cron: "15 23 * * *" # 23:15 UTC = 08:15 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-jpmorgan-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
