name: KB증권 산업/기업 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): www.kbsec.com 리서치 TR API를 하루 1회,
# 개인용으로만 조회한다. robots.txt 자체가 없는 케이스 — 다른 예외들과
# 동일한 조건(개인용·로컬 실행·저빈도)으로 승인됨.

on:
  schedule:
    - cron: "25 0 * * *" # 00:25 UTC = 09:25 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect-kb-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
