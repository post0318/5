name: KB증권 산업/기업 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): www.kbsec.com 리서치 TR API를 하루 1회,
# 개인용으로만 조회한다. robots.txt 자체가 없는 케이스 — 다른 예외들과
# 동일한 조건(개인용·로컬 실행·저빈도)으로 승인됨.

on:
  schedule:
    # 하루 2회(오너 지시, 2026-09 -- 작성시간과 로드시간의 시차 보완).
    - cron: "25 23 * * *" # 23:25 UTC = 08:25 KST(1차)
    - cron: "25 3 * * *" # 03:25 UTC = 12:25 KST(2차)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 수집 스크립트가 pdf-parse 를 import 한다 — 설치 단계가 없으면
      # ERR_MODULE_NOT_FOUND 로 죽는다(실측, 2026-09).
      - run: npm ci
      - run: node scripts/collect-kb-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
