name: 핵심이슈 가중치 시뮬레이션 (수동)

# 오너 제안 2026-09-21 — 리포트 0.5/뉴스 0.3/트렌드 0.2 를
# 0.3/0.4/0.3 으로 바꾸면 어떤가. 의견 대신 실제 데이터로 확인한다.
# preview 는 LLM 을 호출하지 않아 비용이 0 이다(저장도 안 한다).

on:
  workflow_dispatch:
    inputs:
      weights:
        description: "비교할 가중치 research,news,search (쉼표 구분)"
        required: false
        default: "0.4,0.6,0"
      exclude:
        description: "핵심 이슈 후보에서 뺄 주제(쉼표 구분). 비우면 제외 없음"
        required: false
        default: "미국 금리·연준,한국은행·국내 금리,일본은행·엔화"

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - name: 입력 미리보기 받기 (비용 0)
        run: |
          curl -sf --max-time 330 -X POST \
            "https://5-topaz-five.vercel.app/api/cron/weekly-report" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "content-type: application/json" \
            -d '{"preview":true}' -o preview.json
          echo "WEIGHTS=${{ github.event.inputs.weights || '0.4,0.6,0' }}" >> $GITHUB_ENV
          echo "EXCLUDE=${{ github.event.inputs.exclude }}" >> $GITHUB_ENV
      - name: 두 가중치로 순위 비교
        run: |
          python3 - <<'PY'
          import json, os, re
          d = json.load(open("preview.json"))
          print(f"주간: {d['week']['weekStart']} ~ {d['week']['weekEnd']}\n")

          # candidates 텍스트에서 주제별 원시 건수를 뽑는다
          # 예: "- [채택] AI·반도체 수요 — 리포트 12건 · 뉴스 30건 · 검색 55 (점수 0.812)"
          rows = []
          for line in d["candidates"].splitlines():
              m = re.search(r"-\s*(?:\[채택\]\s*)?(.+?)\s*—\s*리포트\s*(\d+)건\s*·\s*뉴스\s*(\d+)건(?:\s*·\s*검색\s*([\d.]+))?", line)
              if m:
                  rows.append({
                      "label": m.group(1).strip(),
                      "res": int(m.group(2)),
                      "news": int(m.group(3)),
                      "search": float(m.group(4)) if m.group(4) else None,
                  })
          if not rows:
              print("candidates 파싱 실패 — 원문 앞부분:")
              print(d["candidates"][:800]); raise SystemExit(0)

          def normalize(vals):
              mx = max(vals) or 1
              return [v / mx for v in vals]

          has_search = any(r["search"] is not None for r in rows)
          nres = normalize([r["res"] for r in rows])
          nnews = normalize([r["news"] for r in rows])
          nsearch = normalize([r["search"] or 0 for r in rows])

          def rank(wr, wn, ws):
              if not has_search:      # issues.ts 와 같은 비례 배분
                  tot = wr + wn
                  wr, wn, ws = wr / tot, wn / tot, 0.0
              scored = [
                  (r["label"], nres[i] * wr + nnews[i] * wn + nsearch[i] * ws, r)
                  for i, r in enumerate(rows)
                  if r["res"] > 0 or r["news"] > 0
              ]
              return sorted(scored, key=lambda x: -x[1])

          cur = rank(0.5, 0.3, 0.2)
          wr, wn, ws = [float(x) for x in os.environ["WEIGHTS"].split(",")]
          new = rank(wr, wn, ws)

          # C안 — 중앙은행 주제는 「5. 금리정책」 섹션이 전담하므로 핵심 이슈
          # 후보에서 뺀다. 같은 내용을 3번·5번에서 두 번 다루는 중복을 없앤다.
          excl = {x.strip() for x in os.environ.get("EXCLUDE", "").split(",") if x.strip()}
          new_ex = [x for x in new if x[0] not in excl]

          print(f"검색 트렌드 사용 여부: {'O' if has_search else 'X (그 몫을 리포트·뉴스로 비례 배분)'}\n")
          print(f"{'순위':<4}{'현재 0.5/0.3/0.2':<34}{f'제안 {wr}/{wn}/{ws}':<34}")
          print("-" * 76)
          for i in range(min(6, len(cur))):
              a = f"{cur[i][0]} ({cur[i][1]:.3f})"
              b = f"{new[i][0]} ({new[i][1]:.3f})"
              mark = "  " if cur[i][0] == new[i][0] else "<<"
              print(f"{i+1:<4}{a:<34}{b:<34}{mark}")

          if excl:
              print("")
              print(f"[C안] 후보에서 제외: {', '.join(sorted(excl))}")
              print(f"{'순위':<4}{'제외 전':<34}{'제외 후':<34}")
              print("-" * 76)
              for i in range(min(6, len(new_ex))):
                  a = f"{new[i][0]} ({new[i][1]:.3f})"
                  b = f"{new_ex[i][0]} ({new_ex[i][1]:.3f})"
                  print(f"{i+1:<4}{a:<34}{b:<34}")
              print("")
              print(f"→ 채택 3개: {', '.join(x[0] for x in new_ex[:3])}")

          cur3 = {x[0] for x in cur[:3]}
          new3 = {x[0] for x in new[:3]}
          print(f"\n상위 3개 변화: {'없음' if cur3 == new3 else ''}")
          for lab in cur3 - new3:
              print(f"  빠짐: {lab}")
          for lab in new3 - cur3:
              print(f"  들어옴: {lab}")

          # 국내 주제는 네이버만 쓰고 해외는 구글 RSS(when:7d)가 더해진다.
          DOMESTIC = {"한국은행·국내 금리", "원달러 환율", "코스피 수급·외국인", "2차전지·전기차", "조선·방산"}
          print("\n전 주제 원시 건수 (리포트 / 뉴스 / 검색)   [국내]=네이버만")
          for lab, sc, r in new:
              tag = "[국내]" if lab in DOMESTIC else "      "
              sv = f"{r['search']:.0f}" if r["search"] is not None else "-"
              print(f"  {tag} {lab:<22} {r['res']:>4} / {r['news']:>4} / {sv:>5}")

          dom = [r for r in rows if r["label"] in DOMESTIC]
          ovs = [r for r in rows if r["label"] not in DOMESTIC]
          def avg(xs, k):
              return sum(x[k] for x in xs) / len(xs) if xs else 0
          print(f"\n뉴스 건수 평균 — 국내 {avg(dom,'news'):.1f}건 / 해외 {avg(ovs,'news'):.1f}건")
          zero_dom = [r["label"] for r in dom if r["news"] == 0]
          if zero_dom:
              print(f"  뉴스 0건인 국내 주제: {', '.join(zero_dom)}")
          PY
      - name: 원본 JSON
        uses: actions/upload-artifact@v4
        with:
          name: weekly-weight-sim
          path: preview.json
