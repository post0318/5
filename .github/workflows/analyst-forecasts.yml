name: 애널리스트 투자의견 수집 (StockAnalysis)

# CLAUDE.md 방침(오너 승인): stockanalysis.com 의 종목별 "Latest Forecasts"
# 상위 5명만 하루 1회, 개인용으로 조회한다.
#   - robots.txt 가 /stocks/*/forecast/ 를 막지 않음(Disallow 는 /e/, /p/ 뿐)
#   - ToS 에 크롤링·자동화 금지 조항 없음. "republish in full" 만 금지하고
#     snippets 사용은 출처 명시 조건으로 명시 허용 → 화면에 출처 표기함.
# 유니버스의 미국 종목 수에 비례해 요청이 늘어나므로 종목당 2초 간격을 둔다.

on:
  # 예약 실행은 오라클 타이머(ops/oracle/install-schedules.sh, 2026-10-04) — 여기는 수동 비상용
  workflow_dispatch: {}

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/collect-analyst-forecasts.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
