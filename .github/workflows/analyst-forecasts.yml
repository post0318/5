name: 애널리스트 투자의견 수집 (StockAnalysis)

# CLAUDE.md 방침(오너 승인): stockanalysis.com 의 종목별 "Latest Forecasts"
# 상위 5명만 하루 1회, 개인용으로 조회한다.
#   - robots.txt 가 /stocks/*/forecast/ 를 막지 않음(Disallow 는 /e/, /p/ 뿐)
#   - ToS 에 크롤링·자동화 금지 조항 없음. "republish in full" 만 금지하고
#     snippets 사용은 출처 명시 조건으로 명시 허용 → 화면에 출처 표기함.
# 유니버스의 미국 종목 수에 비례해 요청이 늘어나므로 종목당 2초 간격을 둔다.

on:
  schedule:
    - cron: "20 1 * * *" # 01:20 UTC = 10:20 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect-analyst-forecasts.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
