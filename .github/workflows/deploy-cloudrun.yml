name: 구글 Cloud Run 배포

# 구글 Cloud Run 에 앱을 배포한다(2026-10-03 — Vercel Hobby 정지 대응, Vercel 과 같은 커밋을 동시 배포).
# GitHub 이 구글에 키 없이 접속한다(Workload Identity Federation). 저장소 변수 GCP_PROJECT·GCP_WIF_PROVIDER·GCP_SA 가 없으면 건너뛴다.
# 비밀값은 GitHub 비밀값(Settings → Secrets → Actions)이 원본 — 값이 있는 것만 Cloud Run 환경변수로 넣는다.
#   - master push(앱 파일 변경분만 — vercel.json ignoreCommand·ttm-build 와 같은 경로)
#   - 수동: workflow_dispatch
# 비용 상한: 최대 인스턴스 2, 요청이 없으면 0 대로 줄어든다(무료 범위 안 목표).

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "components.json"
      - "Dockerfile"
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REGION: asia-northeast1
      SERVICE: macroresearch
      IMAGE: asia-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/app/macroresearch:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 이미지 빌드·업로드
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          docker build \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            --build-arg APP_COMMIT_SHA="${{ github.sha }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
      - name: 환경변수 파일(값 있는 비밀값만)
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ALLOWED_EMAIL_DOMAINS: ${{ secrets.ALLOWED_EMAIL_DOMAINS }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY_SECRET: ${{ secrets.NAVER_APIHUB_KEY_SECRET }}
          NAVER_TREND_KEY_ID: ${{ secrets.NAVER_TREND_KEY_ID }}
          NAVER_TREND_KEY_SECRET: ${{ secrets.NAVER_TREND_KEY_SECRET }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          PDFSHIFT_API_KEY: ${{ secrets.PDFSHIFT_API_KEY }}
        run: |
          : > env.yaml
          for k in ADMIN_EMAILS ALLOWED_EMAIL_DOMAINS APP_PASSWORD CLERK_SECRET_KEY NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CRON_SECRET DART_API_KEY DATA_GO_KR_KEY \
                   ECOS_API_KEY EDINET_API_KEY GEMINI_API_KEY JQUANTS_API_KEY KRX_API_KEY MONGODB_URI NAVER_APIHUB_KEY_ID NAVER_APIHUB_KEY_SECRET \
                   NAVER_TREND_KEY_ID NAVER_TREND_KEY_SECRET POLYGON_API_KEY SEC_USER_AGENT YOUTUBE_API_KEY RESEND_API_KEY ALERT_EMAIL_TO PDFSHIFT_API_KEY; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s: %s\n' "$k" "$(jq -Rn --arg v "$v" '$v')" >> env.yaml; else echo "비어 있음(건너뜀): $k"; fi
          done
          printf 'APP_COMMIT_SHA: "%s"\nSEC_CACHE_DIR: "/tmp/.cache"\n' "${{ github.sha }}" >> env.yaml
      - name: Cloud Run 배포
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --project "${{ vars.GCP_PROJECT }}" \
            --allow-unauthenticated --port 8080 --cpu 1 --memory 1Gi --timeout 300 \
            --min-instances 0 --max-instances 2 --concurrency 40 \
            --env-vars-file env.yaml --quiet
          rm -f env.yaml
          echo "주소: $(gcloud run services describe "$SERVICE" --region "$REGION" --project "${{ vars.GCP_PROJECT }}" --format='value(status.url)')"
