name: NH투자증권 투자전략/FICC/자산관리솔루션/모닝미팅브리프 수집

# CLAUDE.md 방침(오너 승인 예외): www.nhsec.com 내부 TR 을 하루 1회, 개인용으로만
# 호출한다. 다른 NH 수집기와 같은 TR(H3211)이고 게시판 코드만 다르다
# (rsh_ppr_dit_cd=02/04/05/06 — 오너가 리서치 포털 스크린샷을 보여줘서 발견).

on:
  schedule:
    - cron: "10 0 * * *" # 00:10 UTC = 09:10 KST (다른 NH 수집기와 동일 시각)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-nh-strategy-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
