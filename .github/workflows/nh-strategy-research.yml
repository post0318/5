name: NH투자증권 투자전략/FICC/자산관리솔루션/모닝미팅브리프 수집

# CLAUDE.md 방침(오너 승인 예외): www.nhsec.com 내부 TR 을 하루 1회, 개인용으로만
# 호출한다. 다른 NH 수집기와 같은 TR(H3211)이고 게시판 코드만 다르다
# (rsh_ppr_dit_cd=02/04/05/06 — 오너가 리서치 포털 스크린샷을 보여줘서 발견).

on:
  schedule:
    # 하루 2회(오너 지시, 2026-09 -- 작성시간과 로드시간의 시차 보완).
    - cron: "10 23 * * *" # 23:10 UTC = 08:10 KST(1차)
    - cron: "10 3 * * *" # 03:10 UTC = 12:10 KST(2차)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-nh-strategy-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
