name: 교보증권 기업분석 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): www.iprovest.com 리서치 서블릿을 하루 1회,
# 개인용으로만 조회한다. robots.txt 확인이 애매한 4중 프레임 구조 사이트라
# 다른 예외들과 동일한 조건(개인용·로컬 실행·저빈도)으로 보수적으로 승인됨.

on:
  schedule:
    # 하루 2회(오너 지시, 2026-09 -- 작성시간과 로드시간의 시차 보완).
    - cron: "40 23 * * *" # 23:40 UTC = 08:40 KST(1차)
    - cron: "40 3 * * *" # 03:40 UTC = 12:40 KST(2차)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 수집 스크립트가 pdf-parse 를 import 한다 — 설치 단계가 없으면
      # ERR_MODULE_NOT_FOUND 로 죽는다(실측, 2026-09).
      - run: npm ci
      - run: node scripts/collect-kyobo-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
