name: 교보증권 기업분석 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): www.iprovest.com 리서치 서블릿을 하루 1회,
# 개인용으로만 조회한다. robots.txt 확인이 애매한 4중 프레임 구조 사이트라
# 다른 예외들과 동일한 조건(개인용·로컬 실행·저빈도)으로 보수적으로 승인됨.

on:
  schedule:
    - cron: "40 0 * * *" # 00:40 UTC = 09:40 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect-kyobo-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
