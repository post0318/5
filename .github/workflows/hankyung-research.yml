name: 한경 컨센서스 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): consensus.hankyung.com(다수 증권사 리포트
# 통합 목록)을 하루 1회, 개인용으로만 조회한다. 개별 증권사 자사 사이트가
# 아니라 한국경제신문의 3자 편집 서비스라는 차이를 인지한 상태로, 다른
# 예외들과 동일한 조건(개인용·로컬 실행(GitHub Actions 개인 자동화)·저빈도)
# 으로 승인됨. robots.txt가 Disallow: / 임.

on:
  schedule:
    - cron: "50 0 * * *" # 00:50 UTC = 09:50 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect-hankyung-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
