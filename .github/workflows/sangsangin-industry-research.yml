name: 상상인증권 산업리포트/주식시장 수집

# CLAUDE.md 방침(오너 승인 예외): www.sangsanginib.com 내부 API 를 하루 2회,
# 개인용으로만 호출한다. 로그인 불필요. 기업리포트 수집기와 같은 API
# (POST /notice/getNoticeList)를 cmsCd만 바꿔 재사용(오너 지적, 2026-09 —
# "상상인증권은? 산업리포트가 버젓이 공개하는데" + "투자전략도 있고").

on:
  # 예약 실행은 오라클 타이머(ops/oracle/install-schedules.sh, 2026-10-04) — 여기는 수동 비상용
  workflow_dispatch: {}

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-sangsangin-industry-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
