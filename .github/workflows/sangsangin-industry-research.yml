name: 상상인증권 산업리포트/주식시장 수집

# CLAUDE.md 방침(오너 승인 예외): www.sangsanginib.com 내부 API 를 하루 2회,
# 개인용으로만 호출한다. 로그인 불필요. 기업리포트 수집기와 같은 API
# (POST /notice/getNoticeList)를 cmsCd만 바꿔 재사용(오너 지적, 2026-09 —
# "상상인증권은? 산업리포트가 버젓이 공개하는데" + "투자전략도 있고").

on:
  schedule:
    # 다른 상상인 수집기와 동일 시각(같은 증권사는 같이 돌림).
    - cron: "0 23 * * *" # 23:00 UTC = 08:00 KST(1차)
    - cron: "0 3 * * *" # 03:00 UTC = 12:00 KST(2차)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-sangsangin-industry-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
