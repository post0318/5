name: GlobalMonitor 미국주식 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): globalmonitor.einfomax.co.kr 의 미국주식
# 리포트 통합 목록을 하루 1회, 개인용으로만 조회한다. robots.txt 자체가
# 없는 케이스 — 오너가 URL을 직접 제시하며 사용을 지시해 승인됨.

on:
  schedule:
    # 하루 2회(오너 지시, 2026-09 -- 작성시간과 로드시간의 시차 보완).
    - cron: "55 23 * * *" # 23:55 UTC = 08:55 KST(1차)
    - cron: "55 3 * * *" # 03:55 UTC = 12:55 KST(2차)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 이 수집기는 공용 추출기(scripts/lib/us-research-extract.mjs)를 거쳐
      # pdf-parse 를 쓴다. 설치 단계가 빠져 있어 매 실행이
      # ERR_MODULE_NOT_FOUND 로 죽고 있었다(실측 2026-09-17).
      - run: npm ci
      - run: node scripts/collect-globalmonitor-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
