name: 키움증권 미국 산업/기업분석 수집

# CLAUDE.md 방침(오너 승인 예외): bbn.kiwoom.com 의 "미국 산업/기업분석"
# 게시판을 하루 3회, 개인용으로만 조회한다. robots.txt 는 www3/bbn 모두
# Allow: / 로 제한 없음 — 다른 예외들과 동일 조건(개인용·로컬 실행·저빈도)
# 으로 진행.

on:
  # 예약 실행은 오라클 타이머(ops/oracle/install-schedules.sh, 2026-10-04) — 여기는 수동 비상용
  workflow_dispatch: {}

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # 수집 스크립트가 pdf-parse 를 import 한다(로그인 없이 PDF 접근 가능).
      - run: npm ci
      - run: node scripts/collect-kiwoom-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
