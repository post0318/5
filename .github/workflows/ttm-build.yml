name: 미국 TTM 스냅샷 미리 채우기 (ttm_snap)

# 개요 시가총액·멀티플이 쓰는 미국 TTM(현재 주식수·LTM·EV 구성요소)을 종목별로 DB 에 미리 계산해 둔다(src/lib/db/ttm-snap.ts,
# 오너 결정 2026-10-01 (가)). 저장본은 같은 배포판(커밋)·24시간 안일 때만 쓰이므로 매일 + 배포 직후 다시 채운다.
#   - 하루 1회: 21:50 UTC = 06:50 KST (재무 배치 fin-build 06:10 KST 뒤 — 매출(fin) 저장본이 먼저 갱신돼야 TTM 계산이 빠르다)
#   - master push(앱 파일 변경분만): 운영 배포판이 이 커밋으로 바뀔 때까지 기다린 뒤(최대 20분) 채운다
#   - 수동: workflow_dispatch (symbols 를 주면 그 종목만)
# 계산은 이 실행 서버에서 한다(scripts/run/ttm-build.mts — 운영 서버 CPU 사용 안 함, 2026-10-03 오너 결정. 예전엔 운영 앱
# /api/cron/ttm-build 를 불러 Vercel 이 종목당 30~40초씩 계산했고, Hobby Active CPU 한도 초과의 주원인이었다).
# 운영에는 배포판 번호만 묻는다(GET — 계산 없음). 그 커밋을 받아 같은 코드로 계산하고 그 번호로 저장해야 운영이 저장본을 쓴다
# (앱 파일이 안 바뀐 푸시는 배포를 생략하므로 master 최신 커밋과 운영 배포판이 다를 수 있다).

on:
  schedule:
    - cron: "50 21 * * *"
  push:
    branches: [master]
    # 앱 파일이 바뀐 푸시만(vercel.json ignoreCommand 와 같은 경로) — 검증기·수집기·문서만 바뀐 푸시는 배포도 생략되므로 다시 채울 필요가 없다.
    # 2026-10-03: 푸시마다 전 종목을 다시 채워 이틀간 35회 실행, Vercel Hobby Active CPU 한도(월 4시간) 초과로 서비스 정지
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "components.json"
      - "vercel.json"
  workflow_dispatch:
    inputs:
      symbols:
        description: "쉼표 구분 종목(비우면 유니버스 미국 전체 중 저장본 없는 것만)"
        default: ""

concurrency:
  group: ttm-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE: https://macroresearch.vercel.app
      SYMBOLS: ${{ inputs.symbols }}
      SHA: ${{ github.sha }}
    steps:
      - name: 운영 배포판 확인(push 면 이 커밋 반영까지 대기)
        id: ver
        run: |
          for i in $(seq 1 40); do
            v=$(curl -sS --max-time 20 "$BASE/api/cron/ttm-build" | jq -r '.version // ""' 2>/dev/null || echo "")
            if [ "${{ github.event_name }}" != "push" ] && [ -n "$v" ] && [ "$v" != "local" ]; then echo "운영 배포판: $v"; echo "v=$v" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$v" = "$SHA" ]; then echo "배포 반영 확인: $v"; echo "v=$v" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "대기 $i — 운영 배포판 ${v:-?}"; sleep 30
          done
          echo "::error::운영 배포판을 확인하지 못함(push 면 20분 안에 $SHA 로 바뀌지 않음)"; exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.v }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 저장본 없는 종목 계산·저장(실행 서버)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          VERCEL_GIT_COMMIT_SHA: ${{ steps.ver.outputs.v }}
          NODE_OPTIONS: --conditions=react-server
        run: |
          set -u
          a=""
          if [ -n "${SYMBOLS:-}" ]; then a="--symbols=$SYMBOLS"; fi
          # 운영 배포판 커밋에 실행 스크립트가 없으면(이 방식 도입 전 배포판) master 의 스크립트를 쓴다 — 계산 함수는 체크아웃한 배포판 코드
          f=scripts/run/ttm-build.mts
          if [ ! -f "$f" ]; then mkdir -p scripts/run && git show origin/master:scripts/run/ttm-build.mts > "$f"; fi
          npx -y tsx@4.23.15 --tsconfig tsconfig.json "$f" $a --minutes=100
      - name: 하이라이트 저장본(api_snap) 갱신 요청(배포 직후만)
        # 화면은 24시간 안 저장본을 배포판이 달라도 먼저 보여주고 뒤에서 다시 계산한다(api-snap.ts). 배포 직후 유니버스 미국 종목을 한 번씩
        # 열어 갱신을 걸어 둔다(2026-10-02 오너 지적 — 옛 배포판 문구가 남음). 운영 서버 계산이라 하루 1회 예약에서는 하지 않는다(2026-10-03)
        if: github.event_name == 'push'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/universe-symbols?market=us" > uni.json
          for s in $(jq -r '.items[].symbol' uni.json | sort -u); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 200 "$BASE/api/markets/us/$s/highlights" || echo 000)
            echo "$s $code"
          done
