name: Bank of America Institute 수집

# CLAUDE.md 방침(오너 승인, 2026-09-19): institute.bankofamerica.com 을
# 사이트맵 기반으로 하루 1회 조회한다. robots.txt User-agent: * 기준
# /cgi-bin·/tmp 만 차단, 이 경로는 안 막힘.

on:
  schedule:
    - cron: "40 23 * * *" # 23:40 UTC = 08:40 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-boa-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
