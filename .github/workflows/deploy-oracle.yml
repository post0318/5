name: 오라클 서버 배포

# 오라클 클라우드 무료 ARM 서버(Ampere A1, 오사카)에 앱을 배포한다(2026-10-03 — 구글 Cloud Run 과 같은 커밋을 동시 배포).
# 서버가 저장소(공개)에서 해당 커밋을 받아 직접 빌드한다(ARM 이미지라 GitHub 실행 서버에서 빌드하지 않음).
# 저장소 변수 ORACLE_HOST 와 비밀값 ORACLE_SSH_KEY 가 없으면 건너뛴다.
# 비밀값은 GitHub 비밀값이 원본 — 값이 있는 것만 서버 환경변수 파일(/opt/macro/app.env, 권한 600)로 넣는다.
#   - master push(앱 파일 변경분만 — deploy-cloudrun.yml 과 같은 경로)
#   - 수동: workflow_dispatch

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "components.json"
      - "Dockerfile"
  workflow_dispatch:

concurrency:
  group: deploy-oracle
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: vars.ORACLE_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: SSH 키
        env:
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          HOST: ${{ vars.ORACLE_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: 환경변수 파일(값 있는 비밀값만)
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ALLOWED_EMAIL_DOMAINS: ${{ secrets.ALLOWED_EMAIL_DOMAINS }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NAVER_APIHUB_KEY_ID: ${{ secrets.NAVER_APIHUB_KEY_ID }}
          NAVER_APIHUB_KEY_SECRET: ${{ secrets.NAVER_APIHUB_KEY_SECRET }}
          NAVER_TREND_KEY_ID: ${{ secrets.NAVER_TREND_KEY_ID }}
          NAVER_TREND_KEY_SECRET: ${{ secrets.NAVER_TREND_KEY_SECRET }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          PDFSHIFT_API_KEY: ${{ secrets.PDFSHIFT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          umask 077
          : > app.env
          for k in ADMIN_EMAILS ALLOWED_EMAIL_DOMAINS APP_PASSWORD CLERK_SECRET_KEY NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CRON_SECRET DART_API_KEY DATA_GO_KR_KEY \
                   ECOS_API_KEY EDINET_API_KEY GEMINI_API_KEY JQUANTS_API_KEY KRX_API_KEY MONGODB_URI NAVER_APIHUB_KEY_ID NAVER_APIHUB_KEY_SECRET \
                   NAVER_TREND_KEY_ID NAVER_TREND_KEY_SECRET POLYGON_API_KEY SEC_USER_AGENT YOUTUBE_API_KEY RESEND_API_KEY ALERT_EMAIL_TO PDFSHIFT_API_KEY ANTHROPIC_API_KEY; do
            v="${!k}"
            # docker --env-file 은 따옴표를 벗기지 않으므로 값을 그대로 쓴다(줄바꿈 있는 값은 없음)
            if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v" >> app.env; else echo "비어 있음(건너뜀): $k"; fi
          done
          printf 'APP_COMMIT_SHA=%s\nSEC_CACHE_DIR=/tmp/.cache\n' "${{ github.sha }}" >> app.env
          scp -q app.env "ubuntu@${{ vars.ORACLE_HOST }}:/opt/macro/app.env"
          rm -f app.env
      - name: 서버에서 빌드·재시작
        env:
          HOST: ${{ vars.ORACLE_HOST }}
          SHA: ${{ github.sha }}
          PK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          ssh "ubuntu@$HOST" bash -s -- "$SHA" "$PK" <<'EOF'
          set -euo pipefail
          SHA="$1"; PK="$2"
          cd /opt/macro/src
          git fetch --quiet origin "$SHA"
          git checkout --quiet --force "$SHA"
          docker build --progress=plain \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$PK" \
            --build-arg APP_COMMIT_SHA="$SHA" \
            -t "macro:$SHA" .
          sudo install -d -m 755 /opt/macro/sec-cache  # SEC 원본·갱신형 캐시 — 배포해도 남고 배치(run-ts.sh)와 같이 쓴다
          docker rm -f macro >/dev/null 2>&1 || true
          docker run -d --name macro --restart unless-stopped \
            -p 127.0.0.1:8080:8080 --env-file /opt/macro/app.env \
            -v /opt/macro/sec-cache:/tmp/.cache \
            --memory 3g "macro:$SHA" >/dev/null
          # 앱 이미지는 지금 것 + 직전 2개만 남긴다(배치·수집기가 쓰는 node 이미지는 지우지 않게 macro:* 만 정리)
          docker images macro --format '{{.Tag}} {{.CreatedAt}}' | sort -k2 -r | awk 'NR>3 {print $1}' | while read -r t; do docker rmi "macro:$t" >/dev/null 2>&1 || true; done
          docker builder prune -af --max-used-space 4gb >/dev/null || true  # 빌드 캐시 상한 4GB(Docker 29 옵션 — 지금 빌드가 쓰는 캐시는 남는다, 2026-10-03)
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/api/auth/me; then echo "기동 확인"; ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then echo "기동 확인 실패"; docker logs --tail 50 macro; exit 1; fi
          # 배치·수집기 작업 폴더를 같은 커밋으로, 텔레그램 수신기 재시작, TTM 무효 저장본만 채우기(ops/oracle/post-deploy.sh)
          bash /opt/macro/src/ops/oracle/post-deploy.sh "$SHA"
          EOF
          echo "주소: https://${{ vars.ORACLE_DOMAIN }}"
