name: 오라클 서버 배포

# 오라클 클라우드 무료 ARM 서버(Ampere A1, 오사카)에 앱을 배포한다.
# 서버가 저장소(공개)에서 해당 커밋을 받아 직접 빌드한다(ARM 이미지라 GitHub 실행 서버에서 빌드하지 않음).
# 저장소 변수 ORACLE_HOST 와 비밀값 ORACLE_SSH_KEY 가 없으면 건너뛴다.
# **코드만 배포한다(2026-10-06, 오너 승인)** — 운영 비밀값은 서버 /opt/macro/app.env 가 원본이고 GitHub 에는 없다.
# 배포 키는 서버에서 강제 명령(/opt/macro/ops/deploy-entry.sh)에 묶여 `deploy <40자 커밋>` 만 된다(master 에 있는 커밋만).
# 실제 빌드·재시작은 서버가 이 커밋의 ops/oracle/deploy-app.sh 로 한다.
#   - master push(앱 파일 변경분만)
#   - 수동: workflow_dispatch(master 에서만 — 다른 브랜치 커밋은 서버가 거부)

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "components.json"
      - "Dockerfile"
  workflow_dispatch:

concurrency:
  group: deploy-oracle
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: vars.ORACLE_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: SSH 키
        env:
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          HOST: ${{ vars.ORACLE_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: 서버에서 빌드·재시작
        env:
          HOST: ${{ vars.ORACLE_HOST }}
          SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes "ubuntu@$HOST" "deploy $SHA" < /dev/null
          echo "주소: https://${{ vars.ORACLE_DOMAIN }}"
