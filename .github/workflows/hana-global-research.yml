name: 하나증권 글로벌 기업분석 수집

# CLAUDE.md 방침(오너 승인 예외): www.hanaw.com 리서치 목록을 하루 1회,
# 개인용으로만 조회한다. 국내 기업분석 수집기와 같은 사이트·같은 조건이고
# 게시판만 글로벌 기업분석(pid=8&cid=3)으로 다르다.

on:
  schedule:
    - cron: "10 0 * * *" # 00:10 UTC = 09:10 KST (국내 수집기와 동일 시각 — 오너 지시, 2026-09)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 수집 스크립트가 pdf-parse 를 import 한다.
      - run: npm ci
      - run: node scripts/collect-hana-global-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
