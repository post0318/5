name: 주간 거시·시황 리포트 초안 생성

# 매주 월요일 09:00 KST(= 일요일 24:00 UTC → "0 0 * * 1")에 배포 앱의 크론
# 라우트를 호출해 Gemini API(Google AI Pro 구독 크레딧)로 초안을 만든다.
# 생성은 서버(Vercel)에서 돌고 이 워크플로는 트리거만 한다 — 크롤링 없음.
# 오너는 월요일 오후 /weekly 화면에서 검수·수정 후 발행.

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "이미 발행된 주도 다시 생성(true/false)"
        required: false
        default: "false"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 초안 생성 요청
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || 'https://5-topaz-five.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 330 \
            -X POST "$APP_BASE_URL/api/cron/weekly-report" \
            -H "authorization: Bearer $CRON_SECRET" \
            -H "content-type: application/json" \
            -d "{\"force\": $FORCE}")
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"
