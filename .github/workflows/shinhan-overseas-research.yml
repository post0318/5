name: 신한투자증권 해외 기업분석 수집

# CLAUDE.md 방침(오너 승인 예외): bbs2.shinhansec.com 게시판 JSON API를 하루
# 1회, 개인용으로만 조회한다. 국내 수집기(shinhan-research.yml)와 같은 조건,
# 게시판만 다르다(foreignstock).

on:
  schedule:
    - cron: "5 1 * * *" # 01:05 UTC = 10:05 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-shinhan-overseas-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
