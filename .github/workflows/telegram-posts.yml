name: 텔레그램 채널 게시물 수집

# 오너 본인 계정으로 참여 중인 공개 채널(미국 주식 인사이더, 하나증권 강재구)
# 최신 게시물만 가져온다. TELEGRAM_SESSION 은 계정 전체 권한이라 다른 예외들
# (공개 페이지 스크래핑)보다 훨씬 민감함 — 저장소 Secrets에만 두고 절대
# 로그로 출력하지 않는다(scripts/collect-telegram-posts.mjs 참고).

on:
  schedule:
    # KST 08:00~17:00 : 1시간마다 (UTC 23,00~08시 = KST 08~17시)
    - cron: "0 0-8,23 * * *"
    # KST 17:00~익일 08:00 : 3시간마다 (20,23,02,05시 KST = UTC 11,14,17,20시.
    # 17시·08시는 위 1시간 구간과 경계가 겹쳐 중복 실행 없게 여기선 제외)
    - cron: "0 11,14,17,20 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-telegram-posts.mjs
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
