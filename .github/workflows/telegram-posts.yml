name: 텔레그램 채널 게시물 수집

# 오너 본인 계정으로 참여 중인 공개 채널(미국 주식 인사이더, 하나증권 강재구)
# 최신 게시물만 가져온다. TELEGRAM_SESSION 은 계정 전체 권한이라 다른 예외들
# (공개 페이지 스크래핑)보다 훨씬 민감함 — 저장소 Secrets에만 두고 절대
# 로그로 출력하지 않는다(scripts/collect-telegram-posts.mjs 참고).

on:
  schedule:
    # GitHub 은 정각(0분) 예약을 부하 시간대라 자주 지연·누락시킨다(실측: 1시간
    # 예약이 이틀간 4~5시간 간격으로만 실행됨, 2026-09). 그래서 분 값을 정각에서
    # 비껴 7분/37분으로 잡는다.
    # KST 06:00~18:00 : 30분마다 (UTC 21시~익일 09시 직전)
    - cron: "7,37 21-23,0-8 * * *"
    # KST 18:00~익일 06:00 : 1시간마다 (UTC 09~20시)
    - cron: "7 9-20 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-telegram-posts.mjs
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
