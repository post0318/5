name: 텔레그램 채널 게시물 수집

# 오너 본인 계정으로 참여 중인 공개 채널(미국 주식 인사이더, 하나증권 강재구)
# 최신 게시물만 가져온다. TELEGRAM_SESSION 은 계정 전체 권한이라 다른 예외들
# (공개 페이지 스크래핑)보다 훨씬 민감함 — 저장소 Secrets에만 두고 절대
# 로그로 출력하지 않는다(scripts/collect-telegram-posts.mjs 참고).

on:
  # 주 트리거는 외부 크론(cron-job.org)이 호출하는 workflow_dispatch 다.
  # GitHub 의 schedule 이벤트는 이 저장소에서 실측 실행률이 21%(20시간 동안
  # 기대 29회 중 6회, 최대 공백 4시간 36분)에 불과했다 — 분 값을 정각에서
  # 비껴봐도 개선되지 않았고, 예약이 지연이 아니라 아예 누락된다. 반면
  # workflow_dispatch 는 즉시 실행된다(실측). 설정 방법은 DEPLOY.md 참고.
  workflow_dispatch: {}
  schedule:
    # 외부 크론이 죽었을 때를 대비한 백업 경로일 뿐이다. 위 실행률 때문에
    # 이것만으로는 신선도를 보장하지 못한다.
    - cron: "23 * * * *"

# 외부 크론과 백업 스케줄이 겹쳐도 같은 수집이 동시에 두 번 돌지 않게 한다.
# (취소가 아니라 대기 — 회당 40초 내외라 큐가 쌓이지 않는다)
concurrency:
  group: telegram-posts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-telegram-posts.mjs
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
