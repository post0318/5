name: 텔레그램 채널 게시물 수집

# 오너 본인 계정으로 참여 중인 공개 채널(미국 주식 인사이더, 하나증권 강재구)
# 최신 게시물만 가져온다. TELEGRAM_SESSION 은 계정 전체 권한이라 다른 예외들
# (공개 페이지 스크래핑)보다 훨씬 민감함 — 저장소 Secrets에만 두고 절대
# 로그로 출력하지 않는다(scripts/collect-telegram-posts.mjs 참고).

# 2026-10-03 오라클 상주 수신기(macro-telegram-listener, 새 글 즉시)로 이전 — 같은 세션을 동시에 쓰면 끊기므로 예약은 없앴다.
# 수동 비상용만 남긴다(수신기를 멈춘 뒤에만 실행). cron-job.org 의 재기동 작업도 끈다.
# (옛 사정: GitHub schedule 실행률 21% 라 한 번 뜨면 5시간 반 반복하는 우회책을 썼다.)
on:
  workflow_dispatch: {}

# 새로 뜨면 돌고 있던 루프를 끊고 새 루프를 시작한다(cancel-in-progress: true).
# 큐에 쌓아두면 루프가 5시간 반짜리라 대기열이 계속 길어진다. 수집은 upsert 라
# 중간에 끊겨도 유실이 없어 취소가 안전하다.
concurrency:
  group: telegram-posts
  cancel-in-progress: true

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    # 잡 상한(6시간)보다 여유를 두고 끝나게 한다
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 반복 수집 (5시간 30분, 15분 간격)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # 저장소가 공개라 Actions 사용 시간이 무료다 — 긴 실행이 비용이 아니다.
          LOOP_SECONDS: "19800" # 5시간 30분
          INTERVAL_SECONDS: "900" # 15분
        run: |
          set -u
          END=$(( $(date +%s) + LOOP_SECONDS ))
          n=0
          while :; do
            n=$((n + 1))
            echo "::group::수집 #$n ($(date -u +%H:%M:%SZ))"
            # 한 회차가 실패해도 루프는 계속 — 다음 회차가 같은 글을 다시 집는다
            node scripts/collect-telegram-posts.mjs || echo "수집 #$n 실패 — 다음 회차에 재시도"
            echo "::endgroup::"
            NOW=$(date +%s)
            [ $(( NOW + INTERVAL_SECONDS )) -ge $END ] && break
            sleep "$INTERVAL_SECONDS"
          done
          echo "루프 종료 — 총 $n 회 수집"
