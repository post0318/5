name: 한화투자증권 리서치 수집

# CLAUDE.md 방침: www.hanwhawm.com 리서치센터(기업·산업·주식전략·경제·채권·
# 해외주식 게시판 + 첨부 PDF)를 개인용·저빈도로 조회한다. robots.txt 는
# /service/ 등 좁은 경로만 막고 /main/research/·/main/common/common_file/ 은
# 허용한다(실측 2026-09-25). 한경 컨센서스 경유분을 대체(오너 결정 2026-09-25).

on:
  schedule:
    # 하루 2회(오너 지시, 2026-09 -- 작성시간과 로드시간의 시차 보완).
    - cron: "20 23 * * *" # 23:20 UTC = 08:20 KST(1차)
    - cron: "20 3 * * *" # 03:20 UTC = 12:20 KST(2차)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 공용 추출기(scripts/lib/research-extract.mjs)가 pdf-parse 를 import 한다 —
      # 설치 단계가 없으면 ERR_MODULE_NOT_FOUND 로 죽는다(2026-09-25 공용화로 추가).
      - run: npm ci
      - run: node scripts/collect-hanwha-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
