name: 한화투자증권 기업분석 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): www.hanwhawm.com 리서치센터를 하루 1회,
# 개인용으로만 조회한다. robots.txt가 Disallow: / 라 다른 예외들과 동일한
# 조건(개인용·로컬 실행(GitHub Actions 개인 자동화)·저빈도)으로 승인됨.

on:
  schedule:
    # 하루 2회(오너 지시, 2026-09 -- 작성시간과 로드시간의 시차 보완).
    - cron: "20 23 * * *" # 23:20 UTC = 08:20 KST(1차)
    - cron: "20 3 * * *" # 03:20 UTC = 12:20 KST(2차)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect-hanwha-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
