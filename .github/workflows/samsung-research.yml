name: 삼성증권 해외기업/해외산업 수집

# CLAUDE.md 방침(오너 승인 예외): www.samsungpop.com 모바일 리포트 검색의
# "해외기업"/"해외산업" 구분을 하루 2회, 개인용으로만 조회한다. robots.txt 는
# Allow: / 로 제한 없음 — 다른 예외들과 동일 조건(개인용·로컬 실행·저빈도)
# 으로 진행.

on:
  schedule:
    - cron: "20 23 * * *" # 23:20 UTC = 08:20 KST(1차)
    - cron: "20 3 * * *" # 03:20 UTC = 12:20 KST(2차)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 수집 스크립트가 pdf-parse 를 import 한다(로그인 없이 PDF 접근 가능).
      - run: npm ci
      - run: node scripts/collect-samsung-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
