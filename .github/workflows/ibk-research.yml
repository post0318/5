name: IBK투자증권 리서치 수집

# CLAUDE.md 방침(개인용·저빈도): www.ibks.com 리서치 게시판(기업분석·산업분석·
# 전략/시황·경제/채권·해외기업)을 하루 2회 조회한다. robots.txt 는
# `User-Agent: * / Allow: /` 로 제한 없음, 로그인 불필요 — 다른 예외들과 동일
# 조건(개인용·저빈도)으로 진행.

on:
  # 예약 실행은 오라클 타이머(ops/oracle/install-schedules.sh, 2026-10-04) — 여기는 수동 비상용
  workflow_dispatch: {}

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 공용 추출기가 pdf-parse 를 import 한다(로그인 없이 PDF 접근 가능).
      - run: npm ci
      - run: node scripts/collect-ibk-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
