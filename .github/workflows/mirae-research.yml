name: 미래에셋증권 기업분석 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): securities.miraeasset.com 리서치 목록을
# 하루 1회, 개인용으로만 조회한다. robots.txt 에 다른 UA를 막는 규칙이
# 없는 가장 깨끗한 케이스 — 다른 예외들과 동일한 조건(개인용·로컬 실행
# (GitHub Actions 개인 자동화)·저빈도)으로 승인됨.

on:
  # 예약 실행은 오라클 타이머(ops/oracle/install-schedules.sh, 2026-10-04) — 여기는 수동 비상용
  workflow_dispatch: {}

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 이 수집기는 공용 추출기(scripts/lib/research-extract.mjs)를 거쳐
      # pdf-parse 를 쓴다. 설치 단계가 빠져 있어 매 실행이
      # ERR_MODULE_NOT_FOUND 로 죽고 있었다(실측 2026-09-17).
      - run: npm ci
      - run: node scripts/collect-mirae-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
