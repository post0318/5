name: NH투자증권 해외기업분석 수집

# CLAUDE.md 방침(오너 승인 예외): www.nhsec.com 내부 TR 을 하루 1회, 개인용으로만
# 호출한다. 국내 수집기와 같은 TR(H3211, rsh_ppr_dit_cd=01)인데, 종목코드 필드가
# 비어 있는 "[해외기업분석/회사명]" 형식 리포트만 골라 미국 종목으로 수집한다.

on:
  schedule:
    - cron: "15 1 * * *" # 01:15 UTC = 10:15 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-nh-overseas-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
