name: KB증권 해외주식 리서치 수집

# CLAUDE.md 방침(오너 승인 예외): www.kbsec.com 내부 TR 을 하루 1회, 개인용으로만
# 호출한다. 국내 수집기와 같은 TR(s040203010001)이고 탭만 다르다(tab=5 → 4).

on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC = 09:30 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-kb-global-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
