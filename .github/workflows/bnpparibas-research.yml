name: BNP Paribas Economic Research 수집

# CLAUDE.md 방침(오너 승인, 2026-09-19): economic-research.bnpparibas.com 의
# Eco-Week/Eco-Flash/Eco-Conjoncture/Eco-Emerging/Special-Edition 게시판을
# 하루 1회 조회한다. robots.txt User-agent: * 기준 차단 없음.

on:
  schedule:
    - cron: "30 23 * * *" # 23:30 UTC = 08:30 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-bnpparibas-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
