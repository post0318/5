name: 외국인 코스피200 선물 순매수 수집

# CLAUDE.md 방침(오너 승인 예외): 네이버페이 증권 "투자자별 매매동향(선물)"
# 페이지를 하루 1회, 개인용으로만 파싱한다. 예전엔 로컬 PC의 Windows 작업
# 스케줄러로 돌렸는데 PC가 꺼져 있으면 며칠씩 누락됐음(2026-09-08~09-11 공백
# 실측) — 그 문제를 없애려고 GitHub Actions로 옮긴 것이지, "개인용·하루
# 1회" 조건 자체를 벗어나는 건 아니다(공유 저장소가 아니라 이 프로젝트
# 소유자만 쓰는 개인 자동화).

# 2026-10-03 예약은 오라클 타이머 macro-foreign-fut(매일 06:31 KST)로 이전 — 여기는 수동 실행만 남긴다(GitHub 예약 누락 방지).
on:
  workflow_dispatch: {}

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/collect-foreign-fut.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
