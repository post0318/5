name: 상상인증권 기업리포트 수집

# CLAUDE.md 방침(오너 승인 예외): www.sangsanginib.com 내부 API 를 하루 1회,
# 개인용으로만 호출한다. 로그인 불필요, 응답이 종목코드까지 구조화돼 있다.

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 10:00 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-sangsangin-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
