name: Deutsche Bank Research 수집

# CLAUDE.md 방침(오너 승인, 2026-09-19): dbresearch.com 의 홈/주제별 허브
# 페이지(Macro·Geopolitics·Germany·Corporate Landscape)를 하루 1회 조회
# 한다. robots.txt 기준 이 경로들 차단 없음.

on:
  schedule:
    - cron: "50 23 * * *" # 23:50 UTC = 08:50 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-dbresearch.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
