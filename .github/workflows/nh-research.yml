name: NH투자증권 기업/산업분석 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): www.nhsec.com 리서치 TR API를 하루 1회,
# 개인용으로만 조회한다. robots.txt가 Disallow: / 라 다른 예외들과 동일한
# 조건(개인용·로컬 실행(GitHub Actions 개인 자동화)·저빈도)으로 승인됨.

on:
  schedule:
    # 하루 2회(오너 지시, 2026-09 -- 작성시간과 로드시간의 시차 보완).
    - cron: "10 23 * * *" # 23:10 UTC = 08:10 KST(1차)
    - cron: "10 3 * * *" # 03:10 UTC = 12:10 KST(2차)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 수집 스크립트가 pdf-parse 를 import 한다 — 설치 단계가 없으면
      # ERR_MODULE_NOT_FOUND 로 죽는다(실측, 2026-09).
      - run: npm ci
      - run: node scripts/collect-nh-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
