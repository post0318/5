name: 하나증권 글로벌 산업분석/투자전략 수집

# CLAUDE.md 방침(오너 승인 예외): www.hanaw.com 리서치 목록을 하루 1회,
# 개인용으로만 조회한다. 다른 하나증권 수집기와 같은 사이트·같은 조건이고
# 게시판만 글로벌 산업분석(pid=8&cid=2)·글로벌 투자전략(pid=8&cid=1)으로
# 다르다.

on:
  schedule:
    # 하루 2회(오너 지시, 2026-09 -- 작성시간과 로드시간의 시차 보완).
    - cron: "10 23 * * *" # 23:10 UTC = 08:10 KST(1차)
    - cron: "10 3 * * *" # 03:10 UTC = 12:10 KST(2차)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-hana-global-industry-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
