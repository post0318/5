name: BlackRock Investment Institute 위클리 시황 수집

# CLAUDE.md 방침(오너 승인, 2026-09-19): blackrock.com/sg/en/insights 의
# 위클리 시황 페이지(URL 고정, 내용만 매주 교체)를 하루 1회 조회한다.
# robots.txt User-agent: * 기준 차단 없음. 매주 한 번만 내용이 바뀌므로
# 하루 실행해도 대부분은 같은 문서를 재확인(upsert)할 뿐이다.

on:
  # 예약 실행은 오라클 타이머(ops/oracle/install-schedules.sh, 2026-10-04) — 여기는 수동 비상용
  workflow_dispatch: {}

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/collect-blackrock-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
