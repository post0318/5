name: 한국투자증권 기업/산업분석 리포트 수집

# CLAUDE.md 방침(오너 승인 예외): securities.koreainvestment.com 리서치
# 목록을 하루 1회, 개인용으로만 조회한다. robots.txt가 Disallow: / 라
# 다른 예외들과 동일한 조건(개인용·로컬 실행·저빈도)으로 승인됨.

on:
  # 예약 실행은 오라클 타이머(ops/oracle/install-schedules.sh, 2026-10-04) — 여기는 수동 비상용
  workflow_dispatch: {}

env:
  APP_URL: ${{ vars.APP_URL }} # 자동 작업이 부르는 메인 서버(scripts/lib/app-url.mjs)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # 공용 추출기(scripts/lib/research-extract.mjs)가 pdf-parse 를 import 한다 —
      # 설치 단계가 없으면 ERR_MODULE_NOT_FOUND 로 죽는다(2026-09-25 공용화로 추가).
      - run: npm ci
      - run: node scripts/collect-kis-research.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
